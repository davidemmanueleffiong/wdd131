<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Wdd131 - Dynamic Web Fundamentals - David Emmanuel. This course covers the basics of JavaScript, data types, functions, and DOM manipulation....">

    <link rel="preconnect" href="https://fonts.googleapis.com">

        <div class="hero">
        <picture>

        </picture>
        </div>
    </main>
