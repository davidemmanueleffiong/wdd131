<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy load</title>
    <meta name="description" content="Temples of the church of Jesus Christ of Latter-day-saints.">
    <meta name="author" content="David Emmanuel">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap, styles/temples.css, styles/temples-large.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <main>
        <h1>Lazy load</h1>
        
        <picture class="temple-card">
            <img src="https://placekitten.com/400/600" alt="placeholder Kitten Image" loading="lazy">
        </picture>

         <picture class="temple-card">
            <img src="https://placekitten.com/400/700" alt="placeholder Kitten Image" loading="lazy">
        </picture>

        <picture class="temple-card">
            <img src="https://placekitten.com/400/800" alt="placeholder Kitten Image" loading="lazy" width="400" height="600">
        </picture>

        <picture class="temple-card">
            <img src="https://placekitten.com/400/650" alt="placeholder Kitten Image" loading="lazy" width="400" height="600">
        </picture>

        <picture class="temple-card">
            <img src="https://placekitten.com/400/750" alt="placeholder Kitten Image" loading="lazy" width="400" height="600">
        </picture>

        <picture class="temple-card">
            <img src="https://placekitten.com/400/600" alt="placeholder Kitten Image" loading="lazy" width="400" height="600">
        </picture>

        <picture class="temple-card">
            <img src="https://placekitten.com/400/700" alt="placeholder Kitten Image" loading="lazy" width="400" height="600">
        </picture>
    </main>

    <footer>
        <p>&copy; 2024 David Emmanuel</p>
    </footer>
</body>
</html>
