<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | LagosBites Food Blog</title>
  <meta name="description" content="Submit your LagosBites product review. Share ratings, features, and experiences to help others discover the best food in Lagos, Nigeria.">
  <meta name="author" content="David Emmanuel">
  <!-- Preload fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Syne:wght@700;800&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <header class="wrapper">
    <h2 class="label">Share Your Experience</h2>
    <h1>Product <span>Review.</span></h1>
  </header>
  
  <main id="mainContent">
    <div class="card">
      <form method="get" action="review.html" novalidate>
  
        <!-- Product Name -->
        <div class="field">
          <label for="product">Product Name <span class="req" aria-hidden="true">*</span></label>
          <div class="select-wrap">
            <select id="product" name="product" required aria-required="true">
              <option value="" disabled selected>Select a Product …</option>
              <option value="ac-2000">AC-2000</option>
              <option value="lg-fridge">LG Fridge</option>
              <option value="sony-tv">Sony TV</option>
            </select>
          </div>
        </div>
  
        <div class="divider" role="separator"></div>
  
        <!-- Overall Rating -->
        <div class="field">
          <label>Overall Rating <span class="req" aria-hidden="true">*</span></label>
          <div class="stars">
            <input type="radio" id="star5" name="rating" value="5" required aria-required="true">
            <label for="star5" title="5 stars">★</label>
            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4" title="4 stars">★</label>
            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3" title="3 stars">★</label>
            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2" title="2 stars">★</label>
            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1" title="1 star">★</label>
          </div>
        </div>
  
        <div class="divider" role="separator"></div>
  
        <!-- Date of Installation -->
        <div class="field">
          <label for="installDate">Date of Installation <span class="req" aria-hidden="true">*</span></label>
          <input type="date" id="installDate" name="installDate" required aria-required="true" autocomplete="off">
        </div>
  
        <div class="divider" role="separator"></div>
  
        <!-- Useful Features -->
        <div class="field">
          <label for="features">Useful Features <span class="req" aria-hidden="true">*</span></label>
          <div class="checkbox-grid">
            <label class="checkbox-item" for="durability">
              <input type="checkbox" id="durability" name="features" value="Durability">
              <span class="box"></span>
              <span class="box-label">Durability</span>
            </label>
            <label class="checkbox-item" for="easeofuse">
              <input type="checkbox" id="easeofuse" name="features" value="Ease of Use">
              <span class="box"></span>
              <span class="box-label">Ease of Use</span>
            </label>
            <label class="checkbox-item" for="performance">
              <input type="checkbox" id="performance" name="features" value="Performance">
              <span class="box"></span>
              <span class="box-label">Performance</span>
            </label>
            <label class="checkbox-item" for="design">
              <input type="checkbox" id="design" name="features" value="Design">
              <span class="box"></span>
              <span class="box-label">Design</span>
            </label>
          </div>
        </div>
  
        <div class="divider" role="separator"></div>
  
        <!-- Written Review -->
        <div class="field">
          <label for="review">Written Review <span class="req" aria-hidden="true">*</span></label>
          <textarea id="review" name="review" placeholder="Tell us what you think…" required aria-required="true"></textarea>
        </div>
  
        <!-- User Name -->
        <div class="field">
          <label for="username">Your Name <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="username" name="username" placeholder="e.g. Alex M." required aria-required="true" autocomplete="name">
        </div>
  
        <input type="submit" class="btn" value="Post Review →">
  
      </form>
    </div>
  </main>
  <footer>
    <p>&copy; <span id="currentYear"></span> David Emmanuel · Nigeria</p> 
    <p id="lastModified"></p>
  </footer>
</body>
</html>
